# =============================================================================
# Foundry Learn Agent - continuous integration
# Author : dcodev1702 & M365 Copilot / Cowork
# Created: 2026-09-29
#
# Two jobs, no secrets:
#   test       install the lock (floors if there is none), pylint app.py + tests, run the trace-shape tests
#   container  validate the compose files, build the image, start it, and prove the two tracing contracts that
#              need no OpenAI key: /ping is traced (X-Trace-Id + a "GET /ping" span in the log), /healthz is not
# =============================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pylint + trace-shape tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"                   # the Dockerfile's base image (python:3.14.7-slim)
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-dev.txt

      - name: Install dependencies (lock if present, floors otherwise)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock.txt ]; then
            pip install -r requirements.lock.txt
          else
            echo "::warning::requirements.lock.txt not found - installing floors; run scripts/lock.sh and commit the lock"
            pip install -r requirements.txt
          fi
          pip install -r requirements-dev.txt
          pip check

      - name: Pylint (the project keeps app.py and the tests at 10.00/10)
        run: pylint app.py tests

      - name: Trace-shape tests
        run: pytest -q

  container:
    name: image build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate the compose files
        run: |
          cp .env.example .env                       # compose.yaml declares env_file: .env
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f compose.jaeger.yaml config -q
          if [ -f compose.aspire.yaml ]; then docker compose -f compose.yaml -f compose.aspire.yaml config -q; fi

      - name: Build the image
        run: docker build -t foundry-learn-agent:ci .

      - name: Start the container (console exporter, fast span flush, dummy key - nothing calls OpenAI here)
        run: |
          docker run -d --name api -p 127.0.0.1:8000:8000 \
            -e OPENAI_API_KEY=ci-dummy-key -e OTEL_BSP_SCHEDULE_DELAY=500 -e HEALTHZ_INTERVAL_SECONDS=5 \
            foundry-learn-agent:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz | python3 -m json.tool

      - name: "/ping is traced: X-Trace-Id header, trace_id in the body, a GET /ping span in the log"
        run: |
          curl -sS -D headers.txt -o body.json http://127.0.0.1:8000/ping
          cat headers.txt body.json
          TRACE_ID=$(python3 -c "import json; print(json.load(open('body.json'))['trace_id'])")
          echo "$TRACE_ID" | grep -Eq '^[0-9a-f]{32}$'
          grep -i "^x-trace-id: $TRACE_ID" headers.txt
          sleep 2                                    # BatchSpanProcessor flush (OTEL_BSP_SCHEDULE_DELAY=500 ms)
          docker logs api | grep -q '"name": "GET /ping"'
          docker logs api | grep -q "\"trace_id\": \"0x$TRACE_ID\""

      - name: "/healthz is not traced: no header, no span, but counted by the heartbeat"
        run: |
          curl -sS -D headers.txt -o /dev/null http://127.0.0.1:8000/healthz
          ! grep -qi '^x-trace-id:' headers.txt
          sleep 2
          ! docker logs api | grep -q '"name": "GET /healthz"'
          docker logs api | grep '\[healthz\]' | tail -n 1 | grep -q '"/healthz"'

      - name: Container logs (on failure)
        if: failure()
        run: docker logs api || true

      - name: Stop the container
        if: always()
        run: docker rm -f api || true
