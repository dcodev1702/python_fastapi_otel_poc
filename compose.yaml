# =============================================================================
# Foundry Learn Agent - Docker Compose (Linux host, Compose v2: `docker compose`)
# Author : dcodev1702 & M365 Copilot / Cowork
# Created: 2026-09-28
#
# Console mode - spans and the [healthz] heartbeat are printed to the container log:
#   cp .env.example .env            # then put your OPENAI_API_KEY in .env
#   docker compose up --build       # http://localhost:8000/docs
#   docker compose logs -f api      # watch spans + heartbeat
#
# Jaeger mode - spans are shipped to a Jaeger UI at http://localhost:16686 (adds compose.jaeger.yaml on top):
#   docker compose -f compose.yaml -f compose.jaeger.yaml up --build
#
# Ports are published on IPv4 only - 127.0.0.1, plus this host's LAN address when .env sets LAN_IP - never on
# 0.0.0.0 or IPv6, so nothing outside your LAN can connect (as long as your router does not forward them).
#
# Stop everything:  docker compose down          (add -v to drop volumes, --rmi local to drop the image)
# =============================================================================
name: foundry-learn-agent

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: foundry-learn-agent:0.2.2
    container_name: foundry-learn-agent
    ports:                                      # IPv4 only - never 0.0.0.0 or IPv6: /ask spends your OpenAI tokens
      - "127.0.0.1:8000:8000"                   # this host
      - "${LAN_IP:-127.0.0.1}:8000:8000"        # your LAN, when .env sets LAN_IP (unset: same as the line above)
    env_file:
      - .env                                    # OPENAI_API_KEY (and optional overrides) live here, never in this file
    environment:
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-foundry-learn-agent}
      HEALTHZ_INTERVAL_SECONDS: ${HEALTHZ_INTERVAL_SECONDS:-60}
      # OTEL_EXPORTER_OTLP_ENDPOINT is deliberately NOT set here: unset -> ConsoleSpanExporter.
      # compose.jaeger.yaml sets it to http://jaeger:4318 when you want the Jaeger UI.
    deploy:
      resources:
        limits:
          memory: 3g                            # hard RAM cap: the kernel OOM-kills the process above this
        reservations:
          memory: 256m                          # soft guarantee (scheduling hint only)
    # memswap_limit: 3g                         # uncomment to forbid swap too (memory + swap ceiling = 3 GB)
    init: true                                  # tiny PID-1 so signals/zombies are handled properly
    restart: unless-stopped
    healthcheck:                                # overrides the Dockerfile HEALTHCHECK with the same probe
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"]
      interval: 60s
      timeout: 5s
      start_period: 15s
      retries: 3
